name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binaries
        run: make release

      - name: Checksums
        run: |
          cd release
          sha256sum \
            windows-amd64/giffer.exe \
            linux-amd64/giffer \
            linux-arm64/giffer \
            darwin-amd64/giffer \
            darwin-arm64/giffer \
            > SHA256SUMS

      - name: Stage GitHub Release assets
        run: |
          mkdir -p dist
          cp release/windows-amd64/giffer.exe dist/giffer-windows-amd64.exe
          cp release/linux-amd64/giffer dist/giffer-linux-amd64
          cp release/linux-arm64/giffer dist/giffer-linux-arm64
          cp release/darwin-amd64/giffer dist/giffer-darwin-amd64
          cp release/darwin-arm64/giffer dist/giffer-darwin-arm64
          cd dist
          sha256sum giffer-* > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="$(printf '%s\n' \
            'Statically linked binaries (no CGO). No Go install required.' \
            '' \
            'Browse by platform under [`release/`](https://github.com/alienfacepalm/giffer/tree/master/release), or download assets below.' \
            '' \
            '| Platform | Path |' \
            '|----------|------|' \
            '| Windows (x64) | `release/windows-amd64/giffer.exe` |' \
            '| Linux (x64) | `release/linux-amd64/giffer` |' \
            '| Linux (ARM64) | `release/linux-arm64/giffer` |' \
            '| macOS (Intel) | `release/darwin-amd64/giffer` |' \
            '| macOS (Apple Silicon) | `release/darwin-arm64/giffer` |' \
            '' \
            'On Linux/macOS: `chmod +x` the binary, then run it. Put an `upload/` directory next to the binary (or pass `--input`).' \
            '' \
            'Local UI: `./giffer ui` (or `giffer.exe ui` on Windows).')"
          gh release create "$tag" \
            --title "giffer ${tag}" \
            --notes "$notes" \
            dist/giffer-windows-amd64.exe \
            dist/giffer-linux-amd64 \
            dist/giffer-linux-arm64 \
            dist/giffer-darwin-amd64 \
            dist/giffer-darwin-arm64 \
            dist/SHA256SUMS
