name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libwebkit2gtk-4.1-dev \
            gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686

      - name: Build Windows and Linux amd64
        run: go run ./scripts/release windows/amd64 windows/386 linux/amd64

      - name: Upload Linux amd64 and Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-windows
          path: |
            release/windows-amd64
            release/windows-386
            release/linux-amd64

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libwebkit2gtk-4.0-dev

      - name: Build Linux arm64
        run: go run ./scripts/release linux/arm64

      - name: Upload Linux arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: release/linux-arm64

  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build macOS release binaries
        run: |
          mkdir -p release/darwin-amd64 release/darwin-arm64
          version="$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 | tr -d v)"
          echo "stamping version $version"
          for pair in "amd64:darwin-amd64" "arm64:darwin-arm64"; do
            arch="${pair%%:*}"
            dir="${pair##*:}"
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=1 \
              go build -tags desktop -trimpath -ldflags="-s -w" \
              -o "release/$dir/giffer" ./cmd/giffer
            go run ./scripts/macosbundle "release/$dir/giffer" "release/$dir/Giffer.app" "$version"
          done

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: |
            release/darwin-amd64
            release/darwin-arm64

  release:
    needs: [build-linux-windows, build-linux-arm64, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release/windows-amd64 release/windows-386 release/linux-amd64 release/linux-arm64 \
            release/darwin-amd64 release/darwin-arm64 dist
          cp artifacts/linux-windows/windows-amd64/giffer.exe release/windows-amd64/
          cp artifacts/linux-windows/windows-386/giffer.exe release/windows-386/
          cp artifacts/linux-windows/linux-amd64/giffer release/linux-amd64/
          cp artifacts/linux-arm64/linux-arm64/giffer release/linux-arm64/
          cp artifacts/darwin/darwin-amd64/giffer release/darwin-amd64/
          cp -R artifacts/darwin/darwin-amd64/Giffer.app release/darwin-amd64/
          cp artifacts/darwin/darwin-arm64/giffer release/darwin-arm64/
          cp -R artifacts/darwin/darwin-arm64/Giffer.app release/darwin-arm64/
          cd release
          sha256sum \
            windows-amd64/giffer.exe \
            windows-386/giffer.exe \
            linux-amd64/giffer \
            linux-arm64/giffer \
            darwin-amd64/giffer \
            darwin-arm64/giffer \
            > SHA256SUMS
          cp SHA256SUMS ../dist/
          cp windows-amd64/giffer.exe ../dist/giffer-windows-amd64.exe
          cp windows-386/giffer.exe ../dist/giffer-windows-386.exe
          cp linux-amd64/giffer ../dist/giffer-linux-amd64
          cp linux-arm64/giffer ../dist/giffer-linux-arm64
          cp darwin-amd64/giffer ../dist/giffer-darwin-amd64
          cp darwin-arm64/giffer ../dist/giffer-darwin-arm64
          (cd darwin-amd64 && zip -r ../../dist/Giffer-darwin-amd64.app.zip Giffer.app)
          (cd darwin-arm64 && zip -r ../../dist/Giffer-darwin-arm64.app.zip Giffer.app)
          cd ../dist
          sha256sum giffer-* Giffer-*.zip > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="$(printf '%s\n' \
            'Native GUI apps with embedded webview. No Go install required.' \
            '' \
            'Double-click to open the convert UI in a native window, or run `giffer ui`.' \
            '' \
            '| Platform | Double-click | Terminal |' \
            '|----------|--------------|----------|' \
            '| Windows | `giffer.exe` | `giffer.exe ui` |' \
            '| Linux | `giffer` (chmod +x first) | `./giffer ui` |' \
            '| macOS | `Giffer.app` (or `giffer`) | `./giffer ui` |' \
            '' \
            'Browse by platform under [`release/`](https://github.com/alienfacepalm/giffer/tree/master/release), or download assets below.' \
            '' \
            'On Linux/macOS: `chmod +x` the bare binary if needed. Put an `upload/` directory next to the binary (or pass `--input`).' \
            '' \
            'Local UI: double-click the release binary or run `./giffer ui` (native window, not a browser tab).')"
          gh release create "$tag" \
            --title "giffer ${tag}" \
            --notes "$notes" \
            dist/giffer-windows-amd64.exe \
            dist/giffer-windows-386.exe \
            dist/giffer-linux-amd64 \
            dist/giffer-linux-arm64 \
            dist/giffer-darwin-amd64 \
            dist/giffer-darwin-arm64 \
            dist/Giffer-darwin-amd64.app.zip \
            dist/Giffer-darwin-arm64.app.zip \
            dist/SHA256SUMS
