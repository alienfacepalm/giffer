name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt needed on:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Install webkit (Linux desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          pc_path="$(pkg-config --path webkit2gtk-4.1)"
          sudo ln -sf "$pc_path" "${pc_path/4.1/4.0}"

      - name: go build desktop GUI (Linux)
        run: CGO_ENABLED=1 go build -tags desktop -o bin/giffer ./cmd/giffer

      - name: go build desktop GUI (Windows)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags desktop -o bin/giffer.exe ./cmd/giffer
