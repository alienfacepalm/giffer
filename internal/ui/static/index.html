<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>giffer</title>
  <meta name="giffer-csrf" content="{{CSRF_TOKEN}}" />
  <script>
    /* Apply contrast before paint so brand text is readable on first frame. */
    (function () {
      var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-contrast", dark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="stage">
    <header class="brand">
      <p class="mark">giffer</p>
    </header>

    <main class="workspace">
      <section class="controls" aria-label="Convert controls">
        <form id="form" novalidate>
          <label class="drop" id="drop">
            <input
              id="file"
              name="file"
              type="file"
              accept=".zip,.tar,.tgz,.tar.gz,.tbz2,.tbz,.tar.bz2,.txz,.tar.xz,.7z,.rar,application/zip,application/x-tar,application/gzip,application/x-bzip2,application/x-xz,application/x-7z-compressed,application/vnd.rar,application/x-rar-compressed"
              required
            />
            <span class="drop-title" id="drop-label">Photo archive</span>
            <span class="drop-hint">Ordered JPEG, PNG, WebP, or GIF images in zip/tar/7z/rar</span>
            <ul class="formats" aria-label="Supported archive formats">
              <li>zip</li>
              <li>tar.gz</li>
              <li>tar.bz2</li>
              <li>tar.xz</li>
              <li>tar</li>
              <li>7z</li>
              <li>rar</li>
            </ul>
          </label>

          <div class="fields">
            <label>
              <span>delay-ms</span>
              <input id="delay-ms" name="delay-ms" type="number" min="1" step="10" value="100" title="GIF delay; 100ms is the usual safe default" />
            </label>
            <label>
              <span>max-width (0=first)</span>
              <input id="max-width" name="max-width" type="number" min="0" step="1" value="0" title="0 = use first photo width" />
            </label>
            <label>
              <span>loop (0=forever)</span>
              <input id="loop" name="loop" type="number" min="0" step="1" value="0" title="0 = loop forever" />
            </label>
            <label>
              <span>output (.gif)</span>
              <input id="output" name="output" type="text" value="" placeholder="auto from archive name" title="Optional output filename ending in .gif" autocomplete="off" />
            </label>
          </div>

          <div class="progress" id="progress" hidden>
            <div class="progress-meta">
              <span id="progress-label">Converting…</span>
              <span id="progress-pct">0%</span>
            </div>
            <progress id="progress-bar" max="100" value="0"></progress>
          </div>

          <p class="status" id="status" hidden></p>

          <div class="actions">
            <button type="submit" id="go">Convert</button>
            <button type="button" id="reset-btn" title="Clear file, preview, and restore default settings">Reset</button>
          </div>
        </form>
      </section>

      <section class="preview-pane" aria-label="GIF preview">
        <figure class="result is-empty" id="result">
          <div class="forge" id="forge" hidden aria-hidden="true">
            <canvas class="forge-canvas" id="forge-canvas"></canvas>
            <p class="forge-caption" id="forge-caption">Converting…</p>
          </div>
          <div class="result-empty" id="result-empty">
            <span class="result-empty-mark" aria-hidden="true"></span>
            <p class="result-empty-title">No output</p>
            <p class="result-empty-hint">Convert an archive to preview the GIF</p>
          </div>
          <div class="result-stage" id="result-stage" hidden>
            <div class="result-media">
              <img id="preview" alt="Converted GIF preview" hidden />
            </div>
            <div class="result-bar">
              <div class="result-meta">
                <span class="result-meta-label">Output</span>
                <span class="result-filename" id="result-filename"></span>
              </div>
              <a class="download-btn" id="download" download hidden>
                <svg class="download-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path fill="currentColor" d="M8 1.5a.75.75 0 0 1 .75.75v6.19l2.22-2.22a.75.75 0 1 1 1.06 1.06l-3.5 3.5a.75.75 0 0 1-1.06 0l-3.5-3.5a.75.75 0 0 1 1.06-1.06l2.22 2.22V2.25A.75.75 0 0 1 8 1.5ZM2.75 12a.75.75 0 0 0 0 1.5h10.5a.75.75 0 0 0 0-1.5H2.75Z"/>
                </svg>
                <span>Download GIF</span>
              </a>
            </div>
          </div>
        </figure>
      </section>
    </main>

    <footer class="credit">
      <a class="credit-link" href="http://alienfacepalm.com/" target="_blank" rel="noopener noreferrer">
        <img class="credit-mark" src="/afp-mark.png" alt="" width="28" height="28" />
        <span class="credit-copy">AlienFacepalm</span>
      </a>
    </footer>
  </div>
  <script src="/three.min.js"></script>
  <script src="/forge.js"></script>
  <script src="/app.js"></script>
</body>
</html>
